<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lyrics for SoundCloud</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body class="popup-page">
    <main class="popup-shell">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="popup-heading">
        <span>GENIUS COMPANION</span>
        <h1>Lyrics for SoundCloud</h1>
      </div>

      <label class="toggle-row">
        <span><strong>Показывать Lyrics</strong><small>На страницах soundcloud.com</small></span>
        <input id="enabled" type="checkbox">
        <i aria-hidden="true"></i>
      </label>

      <p class="popup-note">После включения обновите открытую вкладку SoundCloud.</p>
      <button id="open-options" class="secondary-button" type="button">Настройки источников</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
